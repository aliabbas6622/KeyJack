<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyJack | Unified API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #111827;
        }
        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .progress-bar {
            height: 6px;
            background-color: #f3f4f6;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #10b981;
        }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight">KeyJack</h1>
                <p class="text-sm text-gray-500">Value-Driven API Gateway</p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center space-x-3 bg-white border border-gray-200 px-4 py-2 rounded-lg">
                <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">Master Key</span>
                <span id="masterKeyDisplay" class="text-sm font-mono text-gray-700">••••••••••••</span>
                <button onclick="copyMasterKey()" class="text-xs font-semibold text-blue-600 hover:text-blue-700">Copy</button>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="card p-5">
                <div class="text-xs font-medium text-gray-400 uppercase mb-1">Total Keys</div>
                <div id="statTotalKeys" class="text-2xl font-semibold">0</div>
            </div>
            <div class="card p-5">
                <div class="text-xs font-medium text-gray-400 uppercase mb-1">Success Rate</div>
                <div id="statSuccessRate" class="text-2xl font-semibold text-emerald-600">0%</div>
            </div>
            <div class="card p-5">
                <div class="text-xs font-medium text-gray-400 uppercase mb-1">Avg Latency</div>
                <div id="statAvgLatency" class="text-2xl font-semibold">0ms</div>
            </div>
            <div class="card p-5">
                <div class="text-xs font-medium text-gray-400 uppercase mb-1">Cache Hits</div>
                <div id="statCacheHits" class="text-2xl font-semibold text-blue-600">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Registration Form -->
            <div class="lg:col-span-1">
                <div class="card p-6">
                    <h2 class="text-sm font-semibold mb-5 text-gray-900">Add Provider Key</h2>
                    <form id="addKeyForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Provider</label>
                            <select id="provider" class="w-full text-sm border-gray-300 border rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="openrouter">OpenRouter</option>
                                <option value="groq">Groq</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">API Key</label>
                            <input type="password" id="keyValue" required class="w-full text-sm border-gray-300 border rounded-md p-2" placeholder="sk-...">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Daily Limit</label>
                            <input type="number" id="dailyLimit" value="100" class="w-full text-sm border-gray-300 border rounded-md p-2">
                        </div>
                        <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white text-sm font-medium py-2 rounded-md transition-colors">Register Key</button>
                    </form>
                </div>

                <!-- Timeline Section (Value 2) -->
                <div class="card p-6 mt-6">
                    <h2 class="text-sm font-semibold mb-4 text-gray-900">Live Timeline</h2>
                    <div id="timelineContainer" class="space-y-3">
                        <!-- Timeline entries -->
                    </div>
                </div>
            </div>

            <!-- Key Pool Table -->
            <div class="lg:col-span-2">
                <div class="card overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                        <h2 class="text-sm font-semibold text-gray-900">Active Key Pool</h2>
                        <button onclick="fetchData()" class="text-xs font-medium text-gray-500 hover:text-gray-700">Refresh</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="text-[10px] font-semibold text-gray-400 uppercase bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3">Provider</th>
                                    <th class="px-6 py-3">Key</th>
                                    <th class="px-6 py-3">Daily Usage</th>
                                    <th class="px-6 py-3">Status</th>
                                    <th class="px-6 py-3"></th>
                                </tr>
                            </thead>
                            <tbody id="keysTableBody" class="divide-y divide-gray-100 text-sm">
                                <!-- Table content -->
                            </tbody>
                        </table>
                    </div>
                    <div id="noKeysMessage" class="p-10 text-center text-gray-400 hidden">
                        No keys registered in the pool.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let config = {};

        async function fetchData() {
            await fetchConfig();
            await fetchKeys();
            await fetchAnalytics();
        }

        async function fetchConfig() {
            try {
                const response = await fetch('/api/config');
                config = await response.json();
                document.getElementById('masterKeyDisplay').textContent = config.masked_master_key;
            } catch (error) {}
        }

        async function fetchKeys() {
            try {
                const response = await fetch('/api/keys');
                const keys = await response.json();
                renderKeys(keys);
                document.getElementById('statTotalKeys').textContent = keys.length;
            } catch (error) {}
        }

        async function fetchAnalytics() {
            try {
                const response = await fetch('/api/analytics');
                const data = await response.json();
                document.getElementById('statSuccessRate').textContent = `${Math.round(data.success_rate)}%`;
                document.getElementById('statAvgLatency').textContent = `${data.avg_latency}ms`;
                document.getElementById('statCacheHits').textContent = data.cache_hits;
                renderTimeline(data.timeline);
            } catch (error) {}
        }

        function renderKeys(keys) {
            const tbody = document.getElementById('keysTableBody');
            const emptyMsg = document.getElementById('noKeysMessage');
            tbody.innerHTML = '';

            if (keys.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }
            emptyMsg.classList.add('hidden');

            keys.forEach(key => {
                const usagePercent = Math.min((key.current_usage / key.daily_limit) * 100, 100);
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors';

                row.innerHTML = `
                    <td class="px-6 py-4 font-medium text-gray-900">${key.provider.charAt(0).toUpperCase() + key.provider.slice(1)}</td>
                    <td class="px-6 py-4 font-mono text-xs text-gray-500">${key.key_value}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-3">
                            <span class="text-xs tabular-nums text-gray-600">${key.current_usage}/${key.daily_limit}</span>
                            <div class="flex-1 min-w-[80px] progress-bar">
                                <div class="progress-fill" style="width: ${usagePercent}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${key.is_active ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">
                            ${key.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="resetKey(${key.id})" class="text-xs text-gray-400 hover:text-gray-900 mr-3">Reset</button>
                        <button onclick="deleteKey(${key.id})" class="text-xs text-red-400 hover:text-red-600">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderTimeline(logs) {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            logs.slice(0, 5).forEach(log => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between text-xs';
                const color = log.status === 200 ? 'text-emerald-500' : 'text-red-500';
                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full ${log.status === 200 ? 'bg-emerald-500' : 'bg-red-500'}"></span>
                        <span class="text-gray-600">${log.provider}</span>
                    </div>
                    <div class="text-gray-400">${log.latency}ms</div>
                `;
                container.appendChild(div);
            });
        }

        async function addKey(e) {
            e.preventDefault();
            const provider = document.getElementById('provider').value;
            const keyValue = document.getElementById('keyValue').value;
            const dailyLimit = document.getElementById('dailyLimit').value;

            const response = await fetch('/api/keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ provider, key_value: keyValue, daily_limit: parseInt(dailyLimit) })
            });
            if (response.ok) {
                document.getElementById('addKeyForm').reset();
                fetchData();
            }
        }

        async function resetKey(id) {
            await fetch(`/api/keys/${id}/reset`, { method: 'POST' });
            fetchData();
        }

        async function deleteKey(id) {
            if (!confirm('Delete this key?')) return;
            await fetch(`/api/keys/${id}`, { method: 'DELETE' });
            fetchData();
        }

        function copyMasterKey() {
            navigator.clipboard.writeText(config.master_key);
            alert('Master Key copied.');
        }

        document.getElementById('addKeyForm').addEventListener('submit', addKey);
        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
