<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyJack Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap');
        body {
            font-family: 'Fira Code', monospace;
            background-color: #0a0a0a;
            color: #00ff00;
        }
        .neon-border {
            border: 1px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        .neon-text {
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        .bg-darker {
            background-color: #111111;
        }
        input, select {
            background-color: #1a1a1a !important;
            border: 1px solid #333 !important;
            color: #00ff00 !important;
        }
        input:focus, select:focus {
            outline: none !important;
            border-color: #00ff00 !important;
        }
        button {
            transition: all 0.2s;
        }
        button:hover {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }
        .progress-bar {
            height: 4px;
            background-color: #222;
        }
        .progress-fill {
            height: 100%;
            background-color: #00ff00;
            box-shadow: 0 0 5px #00ff00;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 border-b border-green-900 pb-6">
            <div class="mb-4 md:mb-0">
                <h1 class="text-4xl font-bold neon-text tracking-tighter">KEYJACK_</h1>
                <p class="text-xs opacity-70 mt-1">UNIFIED_API_GATEWAY_V1.0</p>
            </div>
            <div class="bg-darker p-3 rounded neon-border flex items-center space-x-4">
                <span class="text-xs text-green-700">MASTER_KEY:</span>
                <span id="masterKeyDisplay" class="text-sm font-mono opacity-80">********************</span>
                <button onclick="copyMasterKey()" class="text-xs bg-green-900 hover:bg-green-700 text-white px-2 py-1 rounded">COPY</button>
            </div>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="bg-darker p-6 rounded neon-border">
                <div class="text-xs text-green-700 mb-1">TOTAL_KEYS</div>
                <div id="statTotalKeys" class="text-3xl font-bold">0</div>
            </div>
            <div class="bg-darker p-6 rounded neon-border">
                <div class="text-xs text-green-700 mb-1">ACTIVE_KEYS</div>
                <div id="statActiveKeys" class="text-3xl font-bold text-green-400">0</div>
            </div>
            <div class="bg-darker p-6 rounded neon-border">
                <div class="text-xs text-green-700 mb-1">TOTAL_USAGE_TODAY</div>
                <div id="statTotalUsage" class="text-3xl font-bold">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form -->
            <div class="lg:col-span-1">
                <div class="bg-darker p-6 rounded neon-border">
                    <h2 class="text-xl font-bold mb-6 border-b border-green-900 pb-2">ADD_NEW_KEY</h2>
                    <form id="addKeyForm" class="space-y-4">
                        <div>
                            <label class="block text-xs text-green-700 mb-1">PROVIDER</label>
                            <select id="provider" class="w-full p-2 rounded">
                                <option value="openrouter">OpenRouter</option>
                                <option value="groq">Groq</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-green-700 mb-1">API_KEY_VALUE</label>
                            <input type="password" id="keyValue" required class="w-full p-2 rounded" placeholder="sk-...">
                        </div>
                        <div>
                            <label class="block text-xs text-green-700 mb-1">DAILY_LIMIT</label>
                            <input type="number" id="dailyLimit" value="100" class="w-full p-2 rounded">
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-black font-bold py-2 rounded mt-4">REGISTER_KEY</button>
                    </form>
                </div>
            </div>

            <!-- Table -->
            <div class="lg:col-span-2">
                <div class="bg-darker rounded neon-border overflow-hidden">
                    <div class="p-4 border-b border-green-900 flex justify-between items-center">
                        <h2 class="text-xl font-bold">KEY_POOL</h2>
                        <button onclick="fetchKeys()" class="text-xs border border-green-900 px-2 py-1 hover:bg-green-900">REFRESH</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="text-xs text-green-700 uppercase border-b border-green-900">
                                <tr>
                                    <th class="px-6 py-3">Provider</th>
                                    <th class="px-6 py-3">Key</th>
                                    <th class="px-6 py-3">Usage</th>
                                    <th class="px-6 py-3">Status</th>
                                    <th class="px-6 py-3 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="keysTableBody">
                                <!-- Data will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="noKeysMessage" class="p-12 text-center text-green-900 hidden">
                        NO_KEYS_DETECTED_IN_POOL
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let config = { master_key: "NOT_LOADED" };

        async function fetchConfig() {
            try {
                const response = await fetch('/api/config');
                config = await response.json();
                document.getElementById('masterKeyDisplay').textContent = config.masked_master_key;
            } catch (error) {
                console.error('Error fetching config:', error);
            }
        }

        async function fetchKeys() {
            try {
                const response = await fetch('/api/keys');
                const keys = await response.json();
                renderKeys(keys);
                updateStats(keys);
            } catch (error) {
                console.error('Error fetching keys:', error);
            }
        }

        function renderKeys(keys) {
            const tbody = document.getElementById('keysTableBody');
            const emptyMsg = document.getElementById('noKeysMessage');

            tbody.innerHTML = '';

            if (keys.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            keys.forEach(key => {
                const usagePercent = Math.min((key.current_usage / key.daily_limit) * 100, 100);
                const statusClass = key.is_active ? 'text-green-400' : 'text-red-500';
                const statusText = key.is_active ? 'ACTIVE' : 'EXHAUSTED';

                const row = document.createElement('tr');
                row.className = 'border-b border-green-900/30 hover:bg-green-900/10';

                // Create cells manually to avoid XSS
                const providerCell = document.createElement('td');
                providerCell.className = 'px-6 py-4 font-bold text-xs';
                providerCell.textContent = key.provider.toUpperCase();

                const keyCell = document.createElement('td');
                keyCell.className = 'px-6 py-4 text-xs opacity-60';
                keyCell.textContent = key.key_value;

                const usageCell = document.createElement('td');
                usageCell.className = 'px-6 py-4';
                usageCell.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-xs">${key.current_usage}/${key.daily_limit}</span>
                        <div class="flex-1 min-w-[60px] progress-bar rounded">
                            <div class="progress-fill rounded" style="width: ${usagePercent}%"></div>
                        </div>
                    </div>
                `;

                const statusCell = document.createElement('td');
                statusCell.className = `px-6 py-4 text-xs font-bold ${statusClass}`;
                statusCell.textContent = statusText;

                const actionsCell = document.createElement('td');
                actionsCell.className = 'px-6 py-4 text-right space-x-2';

                const resetBtn = document.createElement('button');
                resetBtn.className = 'text-[10px] border border-green-800 px-2 py-1 hover:bg-green-800';
                resetBtn.textContent = 'RESET';
                resetBtn.onclick = () => resetKey(key.id);

                const delBtn = document.createElement('button');
                delBtn.className = 'text-[10px] border border-red-900 text-red-900 px-2 py-1 hover:bg-red-900 hover:text-white';
                delBtn.textContent = 'DEL';
                delBtn.onclick = () => deleteKey(key.id);

                actionsCell.appendChild(resetBtn);
                actionsCell.appendChild(delBtn);

                row.appendChild(providerCell);
                row.appendChild(keyCell);
                row.appendChild(usageCell);
                row.appendChild(statusCell);
                row.appendChild(actionsCell);

                tbody.appendChild(row);
            });
        }

        function updateStats(keys) {
            document.getElementById('statTotalKeys').textContent = keys.length;
            document.getElementById('statActiveKeys').textContent = keys.filter(k => k.is_active).length;
            document.getElementById('statTotalUsage').textContent = keys.reduce((acc, k) => acc + k.current_usage, 0);
        }

        async function addKey(e) {
            e.preventDefault();
            const provider = document.getElementById('provider').value;
            const keyValue = document.getElementById('keyValue').value;
            const dailyLimit = document.getElementById('dailyLimit').value;

            try {
                const response = await fetch('/api/keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provider, key_value: keyValue, daily_limit: parseInt(dailyLimit) })
                });
                if (response.ok) {
                    document.getElementById('addKeyForm').reset();
                    fetchKeys();
                } else {
                    const err = await response.json();
                    alert(err.detail || 'Failed to add key');
                }
            } catch (error) {
                console.error('Error adding key:', error);
            }
        }

        async function resetKey(id) {
            try {
                await fetch(`/api/keys/${id}/reset`, { method: 'POST' });
                fetchKeys();
            } catch (error) {
                console.error('Error resetting key:', error);
            }
        }

        async function deleteKey(id) {
            if (!confirm('CONFIRM_KEY_DELETION?')) return;
            try {
                await fetch(`/api/keys/${id}`, { method: 'DELETE' });
                fetchKeys();
            } catch (error) {
                console.error('Error deleting key:', error);
            }
        }

        function copyMasterKey() {
            navigator.clipboard.writeText(config.master_key);
            alert('MASTER_KEY_COPIED_TO_CLIPBOARD');
        }

        document.getElementById('addKeyForm').addEventListener('submit', addKey);

        // Initial load
        fetchConfig();
        fetchKeys();
        // Auto refresh every 30 seconds
        setInterval(fetchKeys, 30000);
    </script>
</body>
</html>
